[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pymanager"
version = "0.1.0"
description = "Transparent multi-version Python execution for virtual environments without code or configuration changes."
readme = "README.md"
authors = [{ name = "Jadu" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["environment", "packaging", "compatibility", "virtualenv", "multiversion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    "requests>=2.28.0",
    "packaging>=21.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
pymanager = "pymanager.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pymanager*"]
